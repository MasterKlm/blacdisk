name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed so the release job can attach exe zips to a GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            exe: blackdisk.exe
          - os: ubuntu-latest
            name: linux-x64
            exe: blackdisk
          - os: macos-latest
            name: macos-arm64
            exe: blackdisk

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S core -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Stage distributable folder
        shell: bash
        run: |
          mkdir -p stage
          if [ -f "build/${{ matrix.exe }}" ]; then
            EXE_DIR="build"
          else
            EXE_DIR="build/Release"
          fi
          cp "$EXE_DIR/${{ matrix.exe }}" stage/

          if [ -d "$EXE_DIR/SKILLS" ]; then
            cp -r "$EXE_DIR/SKILLS" stage/
          fi
          if [ -d "$EXE_DIR/assets" ]; then
            cp -r "$EXE_DIR/assets" stage/
          fi

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackdisk-${{ matrix.name }}
          path: stage
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach exe zips to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all exe artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: blackdisk-*
          path: exe-artifacts

      - name: Zip exe artifacts per platform
        shell: bash
        run: |
          cd exe-artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done

      - name: Create/Update GitHub Release with exe assets
        uses: softprops/action-gh-release@v2
        with:
          files: exe-artifacts/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
